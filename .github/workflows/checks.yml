name: Checks
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    env:
      # CI has no phone-facing LAN. Explicit fixture-only loopback configuration.
      GATE_PUBLIC_ORIGIN: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
